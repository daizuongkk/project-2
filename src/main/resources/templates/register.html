<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Đăng ký</title>
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/register/vendor/bootstrap/css/bootstrap.min.css}" />
	<link rel="stylesheet" th:href="@{/register/css/small-business.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/register/register.css}" />
</head>

<body>
	<div class="container">
		<div class="row justify-content-center">
			<div class="register-container">
				<div class="register-card">
					<!-- Header -->
					<div class="register-header">
						<h2><img th:src="@{/img/register-user.png}" alt="register icon" class="header-icon">Tạo tài khoản</h2>
						<p>Vui lòng nhập thông tin đăng ký</p>
					</div>

					<div class="register-body">
						<!-- Access Denied -->
						<div class="alert alert-danger" th:if="${param.accessDenied}">
							<i class="fas fa-ban me-2"></i>
							Bạn không có quyền truy cập
						</div>

						<!-- Session Timeout -->
						<div class="alert alert-danger" th:if="${param.sessionTimeout}">
							<i class="fas fa-clock me-2"></i>
							Phiên đăng nhập đã hết hạn
						</div>

						<!-- Form -->
						<form id="registerForm" th:action="@{/api/users/register}" method="post">

							<!-- Full Name -->
							<div class="form-group">
								<label class="form-label" for="fullName">
									<i class="fas fa-user me-1"></i>Họ và tên
								</label>
								<input type="text" id="fullName" name="fullName" class="form-control" placeholder="Nhập họ và tên"
									required>
							</div>

							<!-- Username -->
							<div class="form-group">
								<label class="form-label" for="username">
									<i class="fas fa-at me-1"></i>Tên đăng nhập
								</label>
								<input type="text" id="username" name="username" class="form-control" placeholder="Chọn tên đăng nhập"
									required>
							</div>

							<!-- Password -->
							<div class="form-group">
								<label class="form-label" for="password">
									<i class="fas fa-lock me-1"></i>Mật khẩu
								</label>
								<div class="password-field">
									<input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu"
										required>
									<button type="button" class="password-toggle" onclick="togglePassword('password')">
										<i class="fas fa-eye"></i>
									</button>
								</div>
							</div>

							<!-- Confirm Password -->
							<div class="form-group">
								<label class="form-label" for="confirmPassword">
									<i class="fas fa-lock me-1"></i>Xác nhận mật khẩu
								</label>
								<div class="password-field">
									<input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
										placeholder="Nhập lại mật khẩu" required>
									<button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
										<i class="fas fa-eye"></i>
									</button>
								</div>
							</div>

							<!-- Terms -->
							<div class="terms-section">
								<div class="form-check">
									<input class="form-check-input" type="checkbox" id="isAgreeTerms" name="isAgreeTerms">
									<label class="form-check-label" for="isAgreeTerms">
										Tôi đồng ý với
										<a href="#" class="terms-link">Điều khoản dịch vụ</a>
										và
										<a href="#" class="terms-link">Chính sách bảo mật</a>
									</label>
								</div>
							</div>

							<!-- Submit -->
							<button class="register-btn" type="submit">
								<i class="fas fa-user-plus me-2"></i>Đăng ký
							</button>
						</form>

						<!-- Social Login -->
						<div class="social-login">
							<div class="social-title">Hoặc đăng ký với</div>
							<div class="social-buttons">
								<a href="#" class="social-btn" title="Đăng ký bằng Facebook">
									<i class="fab fa-facebook-f"></i>
								</a>
								<a th:href="@{/oauth2/authorization/google}" class="social-btn" title="Đăng kí bằng Google">
									<i class="fab fa-google"></i>
								</a>
								<a href="#" class="social-btn" title="Đăng ký bằng Twitter">
									<i class="fab fa-twitter"></i>
								</a>
							</div>
						</div>

						<!-- Login Link -->
						<div class="login-link">
							Đã có tài khoản?
							<a th:href="@{/admin/login}">Đăng nhập tại đây</a>
						</div>

					</div>
				</div>
			</div>
		</div>
	</div>
	<th:block th:replace="~{admin/common/common-scripts :: jquery}"></th:block>
	<!--JavaScript for password toggle-->
	<script>
		function togglePassword(fieldId) {
			const field = document.getElementById(fieldId);
			const toggle = field.nextElementSibling;
			const icon = toggle.querySelector('i');

			if (field.type === 'password') {
				field.type = 'text';
				icon.classList.remove('fa-eye');
				icon.classList.add('fa-eye-slash');
			} else {
				field.type = 'password';
				icon.classList.remove('fa-eye-slash');
				icon.classList.add('fa-eye');
			}
		}

		// Form validation
		document.getElementById('registerForm').addEventListener('submit', function (e) {
			e.preventDefault();

			const password = document.getElementById('password').value;
			const confirmPassword = document.getElementById('confirmPassword').value;
			const isAgreeTerms = document.getElementById('isAgreeTerms').checked;

			if (!isAgreeTerms) {
				alert('Bạn phải đồng ý với điều khoản cộng đồng!');
				return false;
			}

			const fullName = document.getElementById('fullName').value.trim();
			if (fullName.length < 2) {
				alert('Tên phải có ít nhất 2 ký tự!');
				return false;
			}

			const username = document.getElementById('username').value.trim();
			if (username.length < 3) {
				alert('Tên đăng nhập phải có ít nhất 3 ký tự!');
				return false;
			}

			if (password !== confirmPassword) {
				alert('Mật khẩu không khớp!');
				return false;
			}

			if (password.length < 6) {
				alert('Mật khẩu phải chứa ít nhất 6 ký tự!');
				return false;
			}

			const formData = {
				fullName: fullName,
				username: username,
				password: password,
				confirmPassword: confirmPassword
			};

			// Add loading effect to register button
			const registerBtn = document.querySelector('.register-btn');
			registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Đang xử lý...';
			registerBtn.disabled = true;

			// Send AJAX request
			fetch('/api/users/register', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
				},
				body: JSON.stringify(formData)
			})
				.then(response => {
					if (!response.ok) {
						return response.text().then(text => {
							throw new Error(text || 'Đăng ký thất bại');
						});
					}
					return response.json();
				})
				.then(data => {
					alert('Đăng ký thành công. Vui lòng đăng nhập.');
					window.location.href = '/admin/login';
				})
				.catch(error => {
					var message = "Đăng ký thất bại!";
					try {
						// Nếu message là JSON, lấy ra phần message
						const errorJson = JSON.parse(error.message);
						if (errorJson.message) {
							message = errorJson.message;
						}
					} catch (e) {
						// Nếu không phải JSON thì hiện mặc định
						message = error.message || message;
					}
					alert(message);
					// Reset button
					registerBtn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Đăng ký';
					registerBtn.disabled = false;
				});
		});
	</script>
</body>

</html>
