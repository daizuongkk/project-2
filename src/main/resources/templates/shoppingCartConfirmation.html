<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Xác nhận đơn hàng</title>
	<link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
	<th:block th:insert="~{_header}"></th:block>
</head>

<body>

	<th:block th:insert="~{_menu}"></th:block>

	<div class="page-title">Xác nhận</div>
	<div class="customer-info-container">
		<h3>Thông tin khách hàng:</h3>
		<ul>
			<li>Tên: <span th:utext="${myCart.customerInfo.name}"></span></li>
			<li>Email: <span th:utext="${myCart.customerInfo.email}"></span></li>
			<li>Số điện thoại: <span th:utext="${myCart.customerInfo.phone}"></span></li>
			<li>Địa chỉ: <span th:utext="${myCart.customerInfo.address}"></span></li>
		</ul>
		<h3>Tóm tắt giỏ hàng:</h3>
		<ul>
			<li>Số lượng: <span th:utext="${myCart.quantityTotal}"></span></li>
			<li>Tổng cộng:
				<span class="total" th:utext="${#numbers.formatDecimal(myCart.amountTotal,3,2,'COMMA')}">
				</span>
			</li>
		</ul>
	</div>
	<form method="POST" th:action="@{/shoppingCartConfirmation}">
		<!-- Edit Cart -->
		<a class="navi-item" th:href="@{/shoppingCart}">
			Sửa giỏ hàng
		</a>
		<!-- Edit Customer Info -->
		<a class="navi-item" th:href="@{/shoppingCartCustomer}">
			Sửa thông tin khách hàng
		</a>
		<!-- Send/Save -->
		<input type="submit" value="Gửi" class="button-send-sc" />
	</form>
	<div class="container">
		<div class="building-preview-container" th:each="cartLineInfo : ${myCart.cartLines}">
			<ul>
				<li>
					<img class="building-image" src="@{|/productImage?code=${cartLineInfo.productInfo.code}|}" />
				</li>
				<li>
					Mã: <span th:utext="${cartLineInfo.productInfo.code}"></span>
					<input type="hidden" name="code" th:value="${cartLineInfo.productInfo.code}" />
				</li>
				<li>Tên: <span th:utext="${cartLineInfo.productInfo.name}"></span></li>
				<li>Giá:
					<span class="price" th:utext="${#numbers.formatDecimal(cartLineInfo.productInfo.price,3,2,'COMMA')}">
					</span>
				</li>
				<li>Số lượng: <span th:utext="${cartLineInfo.quantity}"></span></li>
				<li>Tạm tính:
					<span class="subtotal" th:utext="${#numbers.formatDecimal(cartLineInfo.amount,3,2,'COMMA')}">
					</span>
				</li>
			</ul>
		</div>
	</div>

	<th:block th:include="_footer"></th:block>

</body>

</html>
