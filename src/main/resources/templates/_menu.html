<div class="menu-container"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">

    <nav class="navbar navbar-expand-lg navbar-light fixed-top"
         style="background-color:#FFFFFF; z-index:1030"
         id="nav-main">
        <div class="logo">
            <a class="nav-link" th:href="@{/}">
                <img src="https://bizweb.dktcdn.net/100/328/362/themes/894751/assets/logo.png?1676257083798"
                     alt="logo">
            </a>
        </div>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" th:href="@{/}">Trang chủ <span class="sr-only">(hiện tại)</span></a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productList}">Giới thiệu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productList}">Tòa nhà</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/news}">Tin tức</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/shoppingCart}">Giỏ hàng</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contact}">Liên hệ</a>
                </li>

                <th:block sec:authorize="hasAnyRole('MANAGER','STAFF')">
                    <li class="nav-item">
                        <a th:href="@{/admin/orderList}" class="nav-link">
                            Danh sách đơn hàng
                        </a>
                    </li>

                </th:block>
                <th:block sec:authorize="hasRole('MANAGER')">
                    <li class="nav-item">
                        <a th:href="@{/admin/building}" class="nav-link">
                            Tạo tòa nhà
                        </a>
                    </li>
                </th:block>


                <th:block sec:authorize="isAuthenticated()">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" th:href="@{/admin/accountInfo}"
                           th:utext="${#authentication.name}" id="navbarDropdown" role="button" data-toggle="dropdown"
                           aria-haspopup="true" aria-expanded="false">
                            Xin chào
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <a class="dropdown-item" th:href="@{/admin/logout}">Đăng xuất</a>
                        </div>
                    </li>
                </th:block>
            </ul>
            <ul class="navbar-nav ml-auto">
                <th:block sec:authorize="!isAuthenticated()">
                    <li class="nav-item">
                        <a th:href="@{/admin/login}" class="btn btn-dark">Đăng nhập<span
                                class="sr-only">(hiện tại)</span></a>
                    </li>
                </th:block>
            </ul>
        </div>
    </nav>
    <!-- ------------------------------nav end---------------------------------- -->
</div>
