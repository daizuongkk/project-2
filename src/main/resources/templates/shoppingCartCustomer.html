<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Thông tin khách hàng</title>
	<link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
	<th:block th:insert="~{_header}"></th:block>
</head>

<body>

	<th:block th:insert="~{_menu}"></th:block>

	<div class="container">
		<div class="row">
			<div class="col-lg-6 offset-3">

				<div class="bd-example">
					<h3>Nhập thông tin khách hàng</h3>
					<form method="POST" th:object="${customerForm}" th:action="@{/shoppingCartCustomer}">
						<div class="form-group">
							<label for="exampleInputEmail1">Tên khách hàng</label>
							<input type="text" class="form-control" id="exampleInputEmail1" th:field="*{name}">
							<span class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">..</span>
						</div>

						<div class="form-group">
							<label for="exampleInputEmail1">Email</label>
							<input type="email" class="form-control" id="exampleInputEmail1" th:field="*{email}">
							<span class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">..</span>
						</div>

						<div class="form-group">
							<label for="exampleInputEmail1">Số điện thoại</label>
							<input type="text" class="form-control" id="exampleInputEmail1" th:field="*{phone}">
							<span class="error-message" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">..</span>
						</div>

						<div class="form-group">
							<label for="exampleInputPassword1">Địa chỉ</label>
							<textarea th:field="*{address}" class="form-control"></textarea>
							<span class="error-message" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">..</span>

						</div>

						<input type="submit" value="Gửi" class="btn btn-primary" />
						<input type="reset" class="btn btn-outline-primary" value="Nhập lại" />
					</form>


				</div>
			</div>
		</div>
	</div>

	<!-- ------------------------------container end---------------------------------- -->


	<th:block th:include="_footer"></th:block>

</body>

</html>

</html>
