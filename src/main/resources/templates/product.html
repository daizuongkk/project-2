<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Thông tin tòa nhà</title>
	<link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
	<th:block th:insert="~{_header}"></th:block>
</head>
<style>
	html,
	body {
		height: 100%;
		font-family: 'Lato', sans-serif;
		font-family: 'Open Sans', sans-serif;
		font-family: 'Abel', sans-serif;
	}
</style>

<body>

	<th:block th:insert="~{_menu}"></th:block>

	<div class="container">
		<div class="row">
			<div class="col-lg-6 offset-3">


				<form th:object="${productForm}" th:action="@{/admin/building}" method="POST" enctype="multipart/form-data">

					<div class="page-title">Tòa nhà</div>
					<div th:if="${errorMessage!= null}" class="error-message" th:utext="${errorMessage}">
					</div>

					<div class="form-group">
						<label for="exampleInputEmail1">Mã</label>
						<input th:field="*{newProduct}" type="hidden" />
						<input th:if="${productForm.newProduct}" type="text" th:field="*{id}" class="form-control" />
						<th:block th:if="${!productForm.newProduct}">
							<span th:utext="${productForm.id}"></span>
							<input type="hidden" th:field="*{id}" />
						</th:block>
						<span class="error-message" th:if="${#fields.hasErrors('id')}" th:errors="*{id}">..</span>

					</div>


					<div class="form-group">
						<label for="exampleInputPassword1">Tên tòa nhà</label>
						<input type="text" class="form-control" th:field="*{name}">
						<span class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">..</span>
					</div>

					<div class="form-group">
						<label for="exampleInputPassword1">Giá</label>
						<input type="text" class="form-control" th:field="*{price}">
						<span class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">..</span>
					</div>

					<div class="form-group">
						<label for="exampleInputPassword1">Ảnh</label>
						<img th:src="@{|/productImage?id=${productForm.id}|}" width="100" />
					</div>

					<div class="form-group">
						<label for="exampleFormControlFile1">Tải ảnh lên</label>
						<input type="file" class="form-control-file" id="exampleFormControlFile1" th:field="*{fileData}">
					</div>

					<input type="submit" value="Lưu" class="btn btn-primary" />
					<input type="reset" value="Nhập lại" class="btn btn-outline-primary" />
				</form>

			</div>
		</div>
	</div>

	<!-- ------------------------------container end---------------------------------- -->


	<th:block th:include="_footer"></th:block>

</body>

</html>
