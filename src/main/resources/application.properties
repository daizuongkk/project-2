
# ===============================
# DATABASE
# ===============================
spring.config.import=optional:file:./application-local.properties,optional:file:./src/main/resources/application-local.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://localhost:3306/estateadvance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
  
 
 
# ===============================
# JPA / HIBERNATE
# ===============================
 
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext



# JWT

jwt.expiration=2592000
jwt.secret=${JWT_SECRET:}


#OAuth2

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}


spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}


spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
